name: build java
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - main
    paths:
      - java/**
      - .github/workflows/build.yaml
  # PR ではビルドだけ確認し、イメージは push しない
  pull_request:
    paths:
      - java/**
      - .github/workflows/build.yaml
permissions:
  contents: read
  packages: write
jobs:
  push:
    name: "yolks:java_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 21-azul_zulu
          - 21-graalvm_jdk
          - 21-open_j9
          - 21-temurin
          - 25-azul_zulu
          - 25-graalvm_jdk
          - 25-open_j9
          - 25-temurin
    steps:
      - uses: actions/checkout@v7
      # linux/amd64 だけをビルドするので QEMU (他アーキのエミュレーション) は使わない
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./java
          file: ./java/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/morinoparty/fruits:java_${{ matrix.tag }}
          # レイヤーを GitHub Actions のキャッシュに置く (matrix のタグごとに分ける)
          cache-from: type=gha,scope=java_${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=java_${{ matrix.tag }}
