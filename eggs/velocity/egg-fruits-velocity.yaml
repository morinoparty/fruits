description: 'Velocity is a Minecraft server proxy with unparalleled server support, scalability, and flexibility. Runs on the morinoparty/fruits Java images (Java 25 / Java 21, Eclipse Temurin / Azul Zulu) with tuned JVM flags. Velocity 4.x requires Java 25.'
