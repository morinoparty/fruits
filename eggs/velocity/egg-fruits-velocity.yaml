  'Java 25 - Temurin': 'ghcr.io/morinoparty/fruits:java_25-temurin'
  'Java 25 - Azul Zulu': 'ghcr.io/morinoparty/fruits:java_25-azul_zulu'
  'Java 21 - Temurin': 'ghcr.io/morinoparty/fruits:java_21-temurin'
  'Java 21 - Azul Zulu': 'ghcr.io/morinoparty/fruits:java_21-azul_zulu'
